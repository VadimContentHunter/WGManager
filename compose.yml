services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      - ./public:/var/www/project
      - ./config/php:/usr/local/etc/php/conf.d

    working_dir: /var/www/project

    environment:
      XDEBUG_MODE: debug
      PHP_IDE_CONFIG: serverName=WgManager

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: >
      sh -c "
        if [ -f /var/www/project/install.sh ]; then
          chmod +x /var/www/project/install.sh;
          /var/www/project/install.sh;
        fi;
        exec php-fpm
      "

  nginx:
    image: nginx:latest

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./public:/var/www/project
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php